<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Show Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#88C0D0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #D8DEE9;
    font-family: Roboto, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #0a0a0a;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #1a1a1a;
  }

  header h1 { font-size: 1.1rem; color: #88C0D0; flex: 1; }

  #add-btn {
    background: #88C0D0;
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #add-btn:active { background: #81A1C1; }

  #list-view, #detail-view {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  #detail-view { display: none; flex-direction: column; gap: 14px; }

  .show-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0d0d;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid #1a1a1a;
  }

  .show-card:active { background: #151515; }

  .show-card img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 6px;
    background: #1a1a1a;
    flex-shrink: 0;
  }

  .show-card .placeholder {
    width: 50px;
    height: 50px;
    border-radius: 6px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .show-info { flex: 1; min-width: 0; }
  .show-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .show-meta { font-size: 0.8rem; color: #88C0D0; margin-top: 2px; }

  #detail-cover {
    width: 100%;
    height: 220px;
    object-fit: contain;
    border-radius: 10px;
    background: #0d0d0d;
    display: none;
    cursor: zoom-in;
  }

  #detail-cover.visible { display: block; }

  #cover-fullscreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  #cover-fullscreen.open { display: flex; }

  #cover-fullscreen img {
    max-width: 95vw;
    max-height: 95dvh;
    object-fit: contain;
    border-radius: 8px;
  }

  #cover-placeholder {
    width: 100%;
    height: 120px;
    background: #0d0d0d;
    border: 2px dashed #2a2a2a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #cover-placeholder:active { border-color: #88C0D0; }

  .cover-btn-row { display: flex; gap: 10px; }

  label { font-size: 0.8rem; color: #88C0D0; display: block; margin-bottom: 4px; }

  input, textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #D8DEE9;
    padding: 10px;
    font-size: 0.95rem;
    font-family: inherit;
  }

  input:focus, textarea:focus { outline: none; border-color: #88C0D0; }

  textarea { resize: vertical; min-height: 80px; }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  .num-input { display: flex; align-items: center; gap: 6px; }
  .num-input input { text-align: center; }
  .num-btn {
    background: #1a1a1a;
    color: #88C0D0;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .num-btn:active { background: #2a2a2a; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-primary { background: #88C0D0; color: #000; }
  .btn-primary:active { background: #81A1C1; }
  .btn-danger { background: #BF616A; color: #fff; }
  .btn-danger:active { background: #a0505a; }
  .btn-secondary { background: #2a2a2a; color: #D8DEE9; }
  .btn-secondary:active { background: #333; }

  #back-btn {
    background: none;
    border: none;
    color: #88C0D0;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    flex: none;
    width: auto;
  }

  .spinner {
    text-align: center;
    padding: 40px;
    color: #555;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #88C0D0;
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <button id="back-btn" style="display:none">&#8592;</button>
  <h1 id="header-title">TV Show Tracker</h1>
  <button id="add-btn">+ Add</button>
</header>

<div id="list-view"><div class="spinner">Loading...</div></div>

<div id="detail-view">
  <img id="detail-cover" alt="Cover" onclick="openFullscreen(this.src)">
  <div id="cover-fullscreen" onclick="this.classList.remove('open')">
    <img id="fullscreen-img" alt="Full Cover">
  </div>
  <div id="cover-placeholder" onclick="document.getElementById('cover-input').click()">📷 Tap to add cover image</div>
  <div class="cover-btn-row">
    <button class="btn-secondary" style="font-size:0.85rem" onclick="document.getElementById('cover-input').click()">Change Cover</button>
    <button class="btn-danger" style="font-size:0.85rem" id="remove-cover-btn">Remove Cover</button>
  </div>
  <input type="file" id="cover-input" accept="image/*" style="display:none">
  <div>
    <label>Title</label>
    <input id="d-title" type="text" placeholder="Show title">
  </div>
  <div>
    <label>Description</label>
    <textarea id="d-desc" placeholder="Description"></textarea>
  </div>
  <div class="row">
    <div>
      <label>Season</label>
      <div class="num-input">
        <button class="num-btn" onclick="step('d-season',-1)">−</button>
        <input id="d-season" type="number" min="1" placeholder="1">
        <button class="num-btn" onclick="step('d-season',1)">+</button>
      </div>
    </div>
    <div>
      <label>Episode</label>
      <div class="num-input">
        <button class="num-btn" onclick="step('d-episode',-1)">−</button>
        <input id="d-episode" type="number" min="1" placeholder="1">
        <button class="num-btn" onclick="step('d-episode',1)">+</button>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="save-btn">Save</button>
    <button class="btn-danger" id="delete-btn">Delete</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const listView = document.getElementById('list-view');
  const detailView = document.getElementById('detail-view');
  const backBtn = document.getElementById('back-btn');
  const addBtn = document.getElementById('add-btn');
  const headerTitle = document.getElementById('header-title');
  const toast = document.getElementById('toast');

  let shows = {};
  let editingKey = null;
  let pendingCoverFile = null;
  let coverRemoved = false;

  async function loadShows() {
    try {
      const r = await fetch('/api/shows');
      shows = await r.json();
      renderList();
    } catch {
      listView.innerHTML = '<div class="spinner">Could not connect to server.</div>';
    }
  }

  function renderList() {
    const sorted = Object.keys(shows).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
    if (!sorted.length) {
      listView.innerHTML = '<div class="spinner">No shows yet. Tap + Add to start.</div>';
      return;
    }
    listView.innerHTML = sorted.map(title => {
      const s = shows[title];
      const img = s.cover_image
        ? `<img src="/api/cover?path=${encodeURIComponent(s.cover_image)}" alt="" onerror="this.outerHTML='<div class=placeholder>📺</div>'">`
        : `<div class="placeholder">📺</div>`;
      return `<div class="show-card" onclick="openDetail('${title.replace(/'/g, "\\'")}')">
        ${img}
        <div class="show-info">
          <div class="show-title">${title}</div>
          <div class="show-meta">S${s.season ?? '?'} E${s.episode ?? '?'}</div>
        </div>
      </div>`;
    }).join('');
  }

  function openDetail(title, pushHistory = true) {
    editingKey = title || null;
    pendingCoverFile = null;
    coverRemoved = false;
    const s = title ? shows[title] : {};
    document.getElementById('d-title').value = title || '';
    document.getElementById('d-desc').value = s.description || '';
    document.getElementById('d-season').value = s.season || '';
    document.getElementById('d-episode').value = s.episode || '';
    document.getElementById('cover-input').value = '';

    setCover(s.cover_image || null);

    document.getElementById('delete-btn').style.display = title ? '' : 'none';
    listView.style.display = 'none';
    detailView.style.display = 'flex';
    backBtn.style.display = '';
    addBtn.style.display = 'none';
    headerTitle.textContent = title || 'New Show';
    if (pushHistory) history.pushState({ detail: true, title }, '', '');
  }

  function setCover(path) {
    const cover = document.getElementById('detail-cover');
    const placeholder = document.getElementById('cover-placeholder');
    if (path) {
      cover.src = path.startsWith('blob:') ? path : `/api/cover?path=${encodeURIComponent(path)}`;
      cover.classList.add('visible');
      placeholder.style.display = 'none';
    } else {
      cover.classList.remove('visible');
      placeholder.style.display = 'flex';
    }
  }

  function showList() {
    detailView.style.display = 'none';
    listView.style.display = '';
    backBtn.style.display = 'none';
    addBtn.style.display = '';
    headerTitle.textContent = 'TV Show Tracker';
  }

  async function saveShow() {
    const title = document.getElementById('d-title').value.trim();
    if (!title) return showToast('Title is required');
    const existingCover = editingKey ? (shows[editingKey]?.cover_image || null) : null;
    const data = {
      description: document.getElementById('d-desc').value.trim(),
      season: parseInt(document.getElementById('d-season').value) || null,
      episode: parseInt(document.getElementById('d-episode').value) || null,
      cover_image: coverRemoved ? null : existingCover
    };
    if (editingKey && editingKey !== title) {
      await fetch(`/api/shows/${encodeURIComponent(editingKey)}`, { method: 'DELETE' });
    }
    await fetch(`/api/shows/${encodeURIComponent(title)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (pendingCoverFile) {
      await fetch(`/api/cover/${encodeURIComponent(title)}`, {
        method: 'POST',
        headers: { 'Content-Type': pendingCoverFile.type },
        body: pendingCoverFile
      });
    }
    await loadShows();
    showToast('Saved');
    showList();
  }

  async function deleteShow() {
    if (!editingKey) return;
    await fetch(`/api/shows/${encodeURIComponent(editingKey)}`, { method: 'DELETE' });
    await loadShows();
    showToast('Deleted');
    showList();
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function openFullscreen(src) {
    document.getElementById('fullscreen-img').src = src;
    document.getElementById('cover-fullscreen').classList.add('open');
  }

  function step(id, delta) {
    const el = document.getElementById(id);
    el.value = Math.max(1, (parseInt(el.value) || 0) + delta);
  }

  document.getElementById('cover-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingCoverFile = file;
    coverRemoved = false;
    setCover(URL.createObjectURL(file));
  });

  document.getElementById('remove-cover-btn').addEventListener('click', () => {
    pendingCoverFile = null;
    coverRemoved = true;
    setCover(null);
  });

  backBtn.addEventListener('click', () => { history.back(); });
  window.addEventListener('popstate', e => {
    if (e.state?.detail) openDetail(e.state.title, false);
    else showList();
  });
  addBtn.addEventListener('click', () => openDetail(null));
  document.getElementById('save-btn').addEventListener('click', saveShow);
  document.getElementById('delete-btn').addEventListener('click', deleteShow);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

  history.replaceState({ detail: false }, '', '');
  loadShows();

  setInterval(async () => {
    if (detailView.style.display === 'flex') return;
    try {
      const r = await fetch('/api/shows');
      const fresh = await r.json();
      if (JSON.stringify(fresh) !== JSON.stringify(shows)) {
        shows = fresh;
        renderList();
      }
    } catch {}
  }, 2000);
</script>
</body>
</html>
